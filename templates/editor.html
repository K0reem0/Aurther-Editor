<!DOCTYPE html>
<html lang="en">
<head>

    <title>Python/OpenCV Image Editor</title>

<body>
    <div id="editor-wrapper">
        <h1>Image Editor</h1>

        <div id="theme-switcher">
            Theme:
            <button id="theme-light-btn">Light</button>
            <button id="theme-dark-btn">Dark</button>
        </div>

        <div class="input-group" style="margin-bottom: 1rem;">
             <label for="image-upload">Upload Image:</label>
             <input type="file" id="image-upload" accept="image/png, image/jpeg, image/gif">
        </div>
        <div id="loading-indicator">Processing...</div>

        <div id="editor-area">
            <div id="canvas-container">
                <canvas id="image-canvas"></canvas>
                <canvas id="overlay-canvas"></canvas>
            </div>

            <div id="controls">
                <div class="tool-group">
                    <strong>Tools:</strong>
                    <div class="button-group">
                        <button id="select-tool-btn" class="active">Select</button>
                        <button id="brush-tool-btn">Brush</button>
                        <button id="inpaint-tool-btn">Inpaint</button>
                        </div>
                </div>

                 <div id="brush-options" class="tool-group" style="display: none;">
                    <strong>Brush Options:</strong>
                    <div class="input-group range-group">
                         <label for="brush-size">Size:</label>
                         <input type="range" id="brush-size" min="1" max="50" value="10">
                         <span id="brush-size-val">10</span>
                    </div>
                    <div class="input-group">
                         <label for="brush-color">Color:</label>
                         <input type="color" id="brush-color" value="#ff0000">
                    </div>
                 </div>

                 <div id="inpaint-options" class="tool-group" style="display: none;">
                     <strong>Inpaint Options:</strong>
                     <div class="input-group range-group">
                         <label for="inpaint-brush-size">Mask Size:</label>
                         <input type="range" id="inpaint-brush-size" min="1" max="100" value="20">
                         <span id="inpaint-brush-size-val">20</span>
                     </div>
                     <div class="button-group">
                         <button id="apply-inpaint-btn">Apply Inpaint</button>
                         <button id="clear-mask-btn">Clear Mask</button>
                     </div>
                 </div>

                 <div class="tool-group">
                    <strong>Text:</strong>
                     <div class="input-group">
                         <input type="text" id="text-input" placeholder="Enter text...">
                     </div>
                    <div class="input-group">
                        <label for="font-select">Font:</label>
                        <select id="font-select">
                            <option value="Arial">Arial</option>
                            <option value="Verdana">Verdana</option>
                            <option value="Times New Roman">Times New Roman</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="font-size">Size:</label>
                        <input type="number" id="font-size" value="30" min="8">
                    </div>
                    <div class="input-group">
                         <label for="font-color">Color:</label>
                         <input type="color" id="font-color" value="#000000">
                    </div>
                     <button id="add-text-btn">Add Text at (10, 30)</button> </div>

                 <div class="tool-group">
                    <strong>Transform:</strong>
                    <div class="button-group">
                        <button id="rotate-btn">Rotate 90° CW</button>
                        </div>
                 </div>

                 <div class="tool-group">
                     <strong>History & Apply:</strong>
                     <div class="button-group">
                         <button id="undo-btn" disabled>Undo</button>
                         </div>
                 </div>

        // --- Theme Switching Logic ---
        const lightThemeBtn = document.getElementById('theme-light-btn');
        const darkThemeBtn = document.getElementById('theme-dark-btn');
        const bodyElement = document.body;

        function applyTheme(themeName) {
            if (themeName === 'dark') {
                bodyElement.classList.add('dark-theme');
                lightThemeBtn.classList.remove('active');
                darkThemeBtn.classList.add('active');
            } else {
                bodyElement.classList.remove('dark-theme');
                darkThemeBtn.classList.remove('active');
                lightThemeBtn.classList.add('active');
            }
            // Store preference in localStorage
            try {
                localStorage.setItem('editorTheme', themeName);
            } catch (e) {
                console.warn("LocalStorage not available. Theme preference won't be saved.");
            }
        }

        lightThemeBtn.addEventListener('click', () => applyTheme('light'));
        darkThemeBtn.addEventListener('click', () => applyTheme('dark'));

        // Load saved theme on page load
        document.addEventListener('DOMContentLoaded', () => {
            let savedTheme = 'light'; // Default to light
            try {
                 savedTheme = localStorage.getItem('editorTheme') || 'light';
            } catch (e) {
                console.warn("LocalStorage not available.");
            }
            applyTheme(savedTheme); // Apply the saved or default theme
        });

</body>
</html>
